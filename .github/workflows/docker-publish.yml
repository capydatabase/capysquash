name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry'
        required: false
        default: false
        type: boolean
      Platforms:
        description: 'Target Platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  # Registry configuration
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: pgsquash

  # Build configuration
  PlatformS: linux/amd64,linux/arm64
  GO_VERSION: "1.25.4"

jobs:
  # ============================================
  # Metadata and Setup
  # ============================================
  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      Platforms: ${{ steps.setup.outputs.Platforms }}
      push: ${{ steps.setup.outputs.push }}
      ghcr-tags: ${{ steps.meta-ghcr.outputs.tags }}
      dockerhub-tags: ${{ steps.meta-dockerhub.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup build parameters
        id: setup
        run: |
          # Determine Platforms
          if [[ "${{ github.event.inputs.Platforms }}" != "" ]]; then
            PlatformS="${{ github.event.inputs.Platforms }}"
          else
            PlatformS="${{ env.PlatformS }}"
          fi
          echo "Platforms=$PlatformS" >> $GITHUB_OUTPUT

          # Determine if we should push
          PUSH="false"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            PUSH="true"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "main" ]]; then
            PUSH="true"
          elif [[ "${{ github.event.inputs.push_to_registry }}" == "true" ]]; then
            PUSH="true"
          fi
          echo "push=$PUSH" >> $GITHUB_OUTPUT

      - name: Extract metadata (common)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=pgsquash
            org.opencontainers.image.description=PostgreSQL Migration Squasher and Optimizer
            org.opencontainers.image.vendor=pgsquash
            org.opencontainers.image.licenses=MIT
            pgsquash.version=${{ github.ref_name }}
            pgsquash.commit=${{ github.sha }}
            pgsquash.build-date=${{ github.run_id }}

      - name: Extract metadata (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/capysquash/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha

      - name: Extract metadata (Docker Hub)
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REGISTRY }}/idominikos/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha

  # ============================================
  # Build and Test
  # ============================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr.io
            registry_name: GHCR
            username_secret: GITHUB_ACTOR
            password_secret: GITHUB_TOKEN
            tags: ${{ needs.metadata.outputs.ghcr-tags }}
          - registry: docker.io
            registry_name: Docker Hub
            username_secret: DOCKERHUB_USERNAME
            password_secret: DOCKERHUB_TOKEN
            tags: ${{ needs.metadata.outputs.dockerhub-tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go tests
        run: |
          go mod download
          go test -v ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          platforms: ${{ needs.metadata.outputs.Platforms }}
          # Use docker-container driver with manual image to avoid Docker Hub issues
          driver: docker-container
          install: true

      - name: Log in to ${{ matrix.registry_name }}
        if: needs.metadata.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[matrix.username_secret] || github.actor }}
          password: ${{ secrets[matrix.password_secret] }}

      - name: Build and push to ${{ matrix.registry_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.metadata.outputs.push == 'true' && needs.metadata.outputs.Platforms || 'linux/amd64' }}
          push: ${{ needs.metadata.outputs.push }}
          load: ${{ needs.metadata.outputs.push != 'true' }}
          tags: ${{ matrix.tags }}
          labels: ${{ needs.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
            BUILD_DATE=${{ github.run_id }}
            GIT_COMMIT=${{ github.sha }}

      - name: Test Docker image
        if: needs.metadata.outputs.push == 'false'
        run: |
          # Get the first tag for testing
          IMAGE_TAG=$(echo "${{ matrix.tags }}" | head -1)

          echo "Testing image: $IMAGE_TAG"

          # Basic functionality test
          docker run --rm "$IMAGE_TAG" --version

          # Help command test
          docker run --rm "$IMAGE_TAG" --help

          # Configuration test
          docker run --rm -e PGSQUASH_SAFETY_LEVEL=standard "$IMAGE_TAG" init

      - name: Run security scan
        if: needs.metadata.outputs.push == 'false'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload security scan results
        if: needs.metadata.outputs.push == 'false'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Integration Testing
  # ============================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: needs.metadata.outputs.push == 'false'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          driver: docker-container
          install: true

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pgsquash:test
          cache-from: type=gha

      - name: Create test migrations
        run: |
          mkdir -p test-migrations
          docker run --rm -v $(pwd)/test-migrations:/app/migrations -e PGSQUASH_INIT_SAMPLE=true pgsquash:test init

      - name: Run squashing workflow
        run: |
          mkdir -p test-output
          docker run --rm \
            -v $(pwd)/test-migrations:/app/migrations \
            -v $(pwd)/test-output:/app/output \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --network host \
            pgsquash:test squash

      - name: Validate output
        run: |
          # Check that output was generated
          ls -la test-output/

          # Check that output contains SQL files
          find test-output -name "*.sql" | wc -l

      - name: Test Docker validation
        run: |
          docker run --rm \
            -v $(pwd)/test-migrations:/app/migrations \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --network host \
            pgsquash:test validate

  # ============================================
  # Docker Compose Testing
  # ============================================
  compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: needs.metadata.outputs.push == 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          driver: docker-container
          install: true

      - name: Build compose images
        run: |
          cp .env.example .env
          docker-compose build pgsquash

      - name: Start services
        run: |
          docker-compose up -d postgres-primary
          sleep 30
          docker-compose up -d pgsquash

      - name: Test compose setup
        run: |
          # Wait for services to be healthy
          timeout 60s bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 2; done'

          # Test pgsquash functionality
          docker-compose exec -T pgsquash pgsquash --version

      - name: Cleanup
        if: always()
        run: |
          docker-compose down -v

  # ============================================
  # Release and Publish
  # ============================================
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [metadata, build, integration-test, compose-test]
    if: needs.metadata.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create release notes
        id: release-notes
        run: |
          # Generate release notes
          cat > release-notes.md << 'EOF'
          ## 🐳 Docker Images

          This release is available as Docker images:

          ```bash
          # GitHub Container Registry
          docker pull ghcr.io/${{ github.repository_owner }}/pgsquash:${{ needs.metadata.outputs.version }}

          # Docker Hub (if configured)
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pgsquash:${{ needs.metadata.outputs.version }}
          ```

          ## 🚀 Quick Start

          ```bash
          # Initialize with sample data
          docker run --rm -v $(pwd):/app/migrations -e PGSQUASH_INIT_SAMPLE=true pgsquash:${{ needs.metadata.outputs.version }} init

          # Squash migrations
          docker run --rm -v $(pwd):/app/migrations -v $(pwd)/output:/app/output pgsquash:${{ needs.metadata.outputs.version }} squash

          # Full workflow with validation
          docker run --rm -v $(pwd):/app/migrations -v $(pwd)/output:/app/output -v /var/run/docker.sock:/var/run/docker.sock pgsquash:${{ needs.metadata.outputs.version }} workflow
          ```

          ## 🐙 Docker Compose

          ```bash
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/.env.example
          cp .env.example .env
          docker-compose up
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            docker-compose.yml
            .env.example
            docker/scripts/build.sh

  # ============================================
  # Cleanup
  # ============================================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [metadata, build]
    if: always()
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete old packages
        if: needs.metadata.outputs.push == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}