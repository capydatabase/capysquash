name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: |
          VERSION="0.9.6"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          go build -v -o pgsquash \
            -ldflags="-X main.version=${VERSION} -X main.buildDate=${BUILD_DATE} -X main.gitCommit=${GIT_COMMIT}" \
            ./cmd/pgsquash

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false


      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

      - name: Verify binary works
        run: |
          ./pgsquash --version
          ./pgsquash --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgsquash-linux-amd64
          path: pgsquash
          retention-days: 7

  # Multi-Platform builds are handled by GoReleaser with goreleaser-cross
  # which provides proper CGO cross-compilation toolchains.
  # See .github/workflows/release.yml for multi-Platform releases.
  #
  # This job is disabled because pg_query_go requires CGO, and cross-compiling
  # with CGO requires Platform-specific toolchains that are not available in
  # standard GitHub Actions runners.
