name: pgsquash Analysis

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'migrations/**/*.sql'
      - 'db/migrations/**/*.sql'
      - 'supabase/migrations/**/*.sql'
      - 'prisma/migrations/**/*.sql'

permissions:
  contents: read
  pull-requests: write  # Required to post comments

jobs:
  analyze-migrations:
    name: Analyze PostgreSQL Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Get full history for better analysis

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'  # Use latest version

      - name: Install pgsquash
        run: go install github.com/capysquash/pgsquash-engine/cmd/pgsquash@latest

      - name: Find migration files
        id: find-migrations
        run: |
          # Try multiple common paths
          MIGRATION_DIRS=("migrations" "db/migrations" "supabase/migrations" "prisma/migrations")
          FILES=""

          for dir in "${MIGRATION_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              found=$(find "$dir" -type f -name "*.sql" 2>/dev/null | tr '\n' ' ')
              FILES="$FILES $found"
            fi
          done

          FILES=$(echo $FILES | xargs)  # Trim whitespace

          if [ -z "$FILES" ]; then
            echo "No migration files found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found migration files: $FILES"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "files=$FILES" >> $GITHUB_OUTPUT
            echo "count=$(echo $FILES | wc -w)" >> $GITHUB_OUTPUT
          fi

      - name: Run pgsquash analysis
        id: analyze
        if: steps.find-migrations.outputs.found == 'true'
        run: |
          set +e  # Don't fail on warnings

          # Run analysis and capture output
          OUTPUT=$(pgsquash analyze ${{ steps.find-migrations.outputs.files }} --verbose 2>&1)
          EXIT_CODE=$?

          # Save output for PR comment
          echo "$OUTPUT" > analysis_output.txt
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Always succeed the step, we'll report results in comment
          exit 0

      - name: Run pgsquash squash (dry-run)
        id: squash
        if: steps.find-migrations.outputs.found == 'true' && steps.find-migrations.outputs.count > 10
        run: |
          set +e  # Don't fail on errors

          # Create output directory
          mkdir -p squashed_migrations

          # Run squash
          pgsquash squash ${{ steps.find-migrations.outputs.files }} \
            --output squashed_migrations \
            --safety standard \
            --dry-run

          SQUASH_EXIT=$?
          echo "squash_exit_code=$SQUASH_EXIT" >> $GITHUB_OUTPUT

          # Count optimized files
          if [ -d "squashed_migrations" ]; then
            SQUASHED_COUNT=$(find squashed_migrations -type f -name "*.sql" | wc -l)
            echo "squashed_count=$SQUASHED_COUNT" >> $GITHUB_OUTPUT
          fi

          exit 0

      - name: Post analysis results as PR comment
        if: steps.find-migrations.outputs.found == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const analysisOutput = fs.readFileSync('analysis_output.txt', 'utf8');
            const migrationCount = '${{ steps.find-migrations.outputs.count }}';
            const exitCode = '${{ steps.analyze.outputs.exit_code }}';
            const squashedCount = '${{ steps.squash.outputs.squashed_count }}' || 'N/A';

            let status = '✅';
            let statusText = 'Analysis Successful';

            if (exitCode !== '0') {
              status = '⚠️';
              statusText = 'Analysis Completed with Warnings';
            }

            let body = `## ${status} pgsquash Migration Analysis\n\n`;
            body += `**Status**: ${statusText}\n`;
            body += `**Migration Files**: ${migrationCount}\n`;

            if (squashedCount !== 'N/A') {
              const reduction = Math.round((1 - squashedCount/migrationCount) * 100);
              body += `**Potential Consolidation**: ${migrationCount} → ${squashedCount} files (${reduction}% reduction)\n`;
            }

            body += `\n### Analysis Output\n\n`;
            body += '```\n' + analysisOutput + '\n```\n\n';

            if (parseInt(migrationCount) >= 10) {
              body += `### 💡 Recommendation\n\n`;
              body += `You have ${migrationCount} migration files. Consider using \`pgsquash squash\` to consolidate them.\n\n`;
              body += '```bash\n';
              body += 'pgsquash squash migrations/*.sql --output consolidated/ --safety standard\n';
              body += '```\n';
            }

            body += '\n---\n';
            body += '*Automated by [pgsquash](https://github.com/capysquash/pgsquash-engine)*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Upload analysis artifacts
        if: steps.find-migrations.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pgsquash-analysis
          path: |
            analysis_output.txt
            squashed_migrations/
          retention-days: 30
