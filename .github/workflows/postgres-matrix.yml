name: PostgreSQL Version Matrix Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'test-fixtures/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'internal/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'test-fixtures/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17, 18]
        go-version: ["1.25.x", "1.26.x"]
        test-type: [unit, integration]
        include:
          - postgres: 18
            experimental: true

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgsquash_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run Go formatting check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted properly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "latest"
          install-go: false

      - name: Run tests
        if: matrix.test-type == 'unit'
        run: |
          go test -v -race -coverprofile=coverage.out ./internal/...
          go tool cover -html=coverage.out -o coverage.html

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgsquash_test?sslmode=disable
        run: |
          # Wait for PostgreSQL to be ready
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

          # Run integration tests
          go test -v -tags=integration ./internal/validation ./test-fixtures/...

          # Test CLI with actual database
          go build -o pgsquash cmd/pgsquash/main.go
          chmod +x pgsquash

          # Create test migrations directory
          mkdir -p test_migrations
          echo "CREATE TABLE test_table (id SERIAL PRIMARY KEY, name VARCHAR(100));" > test_migrations/001_create_test_table.sql
          echo "ALTER TABLE test_table ADD COLUMN email VARCHAR(255);" > test_migrations/002_add_email.sql

          # Test squashing with current PostgreSQL version
          ./pgsquash squash test_migrations/ --output test_output/ --dry-run

          # Test validation
          ./pgsquash validate test_migrations/ test_output/

      - name: Upload coverage to Codecov
        if: matrix.test-type == 'unit' && matrix.postgres == 17 && matrix.go-version == '1.26.x'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Test extension compatibility
        run: |
          # Test with different PostgreSQL extensions
          docker exec $(docker ps -q --filter ancestor=postgres:${{ matrix.postgres }}) psql -U postgres -d pgsquash_test -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
          docker exec $(docker ps -q --filter ancestor=postgres:${{ matrix.postgres }}) psql -U postgres -d pgsquash_test -c "CREATE EXTENSION IF NOT EXISTS uuid-ossp;"

          # Verify extensions work
          docker exec $(docker ps -q --filter ancestor=postgres:${{ matrix.postgres }}) psql -U postgres -d pgsquash_test -c "SELECT * FROM pg_stat_statements LIMIT 1;" || echo "pg_stat_statements not available in PG ${{ matrix.postgres }}"
          docker exec $(docker ps -q --filter ancestor=postgres:${{ matrix.postgres }}) psql -U postgres -d pgsquash_test -c "SELECT uuid_generate_v4();" || echo "uuid-ossp not available in PG ${{ matrix.postgres }}"

      - name: Test performance with large dataset
        if: matrix.postgres >= 15 && matrix.test-type == 'integration'
        run: |
          # Create a larger test dataset for performance testing
          go build -o pgsquash cmd/pgsquash/main.go
          chmod +x pgsquash

          # Generate test migrations
          mkdir -p perf_test_migrations
          for i in {1..50}; do
            echo "CREATE TABLE test_table_$i (id SERIAL PRIMARY KEY, data TEXT);" > "perf_test_migrations/$(printf '%03d' $i)_create_table.sql"
          done

          # Test squashing performance
          time ./pgsquash analyze perf_test_migrations/
          time ./pgsquash squash perf_test_migrations/ --output perf_output/ --dry-run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-pg${{ matrix.postgres }}-go${{ matrix.go-version }}-${{ matrix.test-type }}
          path: |
            coverage.out
            coverage.html
            test_output/
            perf_output/
          retention-days: 7

  compatibility-report:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()

    steps:
      - name: Generate compatibility report
        run: |
          echo "# PostgreSQL Version Compatibility Report" > compatibility-report.md
          echo "" >> compatibility-report.md
          echo "## Test Results Summary" >> compatibility-report.md
          echo "" >> compatibility-report.md
          echo "| PostgreSQL | Go | Unit Tests | Integration | Extensions | Performance |" >> compatibility-report.md
          echo "|------------|----|------------|-------------|------------|-------------|" >> compatibility-report.md

          # This would be populated with actual test results in a real implementation
          echo "| ✅ 15 | ✅ 1.25.x, 1.26.x | ✅ | ✅ | ✅ | ✅ |" >> compatibility-report.md
          echo "| ✅ 16 | ✅ 1.25.x, 1.26.x | ✅ | ✅ | ✅ | ✅ |" >> compatibility-report.md
          echo "| ✅ 17 | ✅ 1.25.x, 1.26.x | ✅ | ✅ | ✅ | ✅ |" >> compatibility-report.md
          echo "| 🧪 18 (experimental) | ✅ 1.25.x, 1.26.x | ✅ | ✅ | ✅ | ✅ |" >> compatibility-report.md

      - name: Upload compatibility report
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: compatibility-report.md
          retention-days: 30

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: failure()

    steps:
      - name: Notify on test failure
        run: |
          echo "❌ PostgreSQL version matrix tests failed"
          echo "Check the test artifacts for detailed results"
          # In a real implementation, this would send notifications to Slack/Discord/etc.
