name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go mod download
          go test -v ./...

      # goreleaser-cross ships the osxcross (o64-clang/oa64-clang) and GNU
      # cross toolchains required for the CGO builds (pg_query_go). The
      # goreleaser-action `distribution` input only supports
      # goreleaser/goreleaser-pro, so the cross image is invoked directly.
      - name: Run GoReleaser (goreleaser-cross)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            -e GITHUB_TOKEN \
            --entrypoint /bin/sh \
            ghcr.io/goreleaser/goreleaser-cross:v1.27.1 \
            -c 'git config --global --add safe.directory /work && goreleaser release --clean'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
