# pgsquash Core Development Environment
# Simplified setup with only essential services
#
# For additional services:
# - Multi-version PostgreSQL testing: docker-compose.testing.yml
# - Development tools (pgAdmin, etc): docker-compose.tools.yml
# - API server: docker/api-server/docker-compose.yml

services:
  # Main pgsquash application
  pgsquash:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_VERSION=${BUILD_VERSION:-dev}
        - BUILD_DATE=${BUILD_DATE:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}
        - GIT_COMMIT=${GIT_COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
    image: pgsquash:${BUILD_VERSION:-dev}
    container_name: pgsquash-app
    restart: unless-stopped
    environment:
      # pgsquash configuration
      - PGSQUASH_SAFETY_LEVEL=${PGSQUASH_SAFETY_LEVEL:-standard}
      - PGSQUASH_AUTO_VALIDATE=${PGSQUASH_AUTO_VALIDATE:-true}
      - PGSQUASH_DOCKER_ENABLED=true
      - PGSQUASH_AUTO_SETUP=true

      # Docker configuration
      - DOCKER_HOST=unix:///var/run/docker.sock

      # Logging
      - PGSQUASH_LOG_LEVEL=${PGSQUASH_LOG_LEVEL:-info}
      - PGSQUASH_LOG_FORMAT=json
    volumes:
      # Migration files
      - ./migrations:/app/migrations:ro
      - ./output:/app/output
      - ./config:/app/config

      # Logs and cache
      - pgsquash-logs:/app/logs
      - pgsquash-cache:/app/.cache

      # Docker socket for validation features (Docker-in-Docker)
      - /var/run/docker.sock:/var/run/docker.sock

      # SSH keys for git operations (optional)
      - ~/.ssh:/home/pgsquash/.ssh:ro
    networks:
      - pgsquash-net
    depends_on:
      postgres-primary:
        condition: service_healthy
    labels:
      - "com.pgsquash.service=engine"
    healthcheck:
      test: ["CMD", "pgsquash", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL 17 for validation and testing
  postgres-primary:
    image: postgres:17
    container_name: pgsquash-postgres-primary
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pgsquash_primary
      - POSTGRES_USER=pgsquash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pgsquash_secure_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./docker/init-scripts/supabase-compat.sql:/docker-entrypoint-initdb.d/01-supabase-compat.sql:ro
      - ./docker/init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - pgsquash-logs:/var/log/postgresql
    networks:
      - pgsquash-net
    ports:
      - "${POSTGRES_PRIMARY_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgsquash -d pgsquash_primary"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.pgsquash.service=postgres-primary"
      - "com.pgsquash.version=17"

# Networks
networks:
  pgsquash-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    labels:
      - "com.pgsquash.network=main"

# Volumes
volumes:
  # PostgreSQL data
  postgres-primary-data:
    driver: local
    labels:
      - "com.pgsquash.volume=postgres-primary-data"

  # Application data
  pgsquash-logs:
    driver: local
    labels:
      - "com.pgsquash.volume=logs"
  pgsquash-cache:
    driver: local
    labels:
      - "com.pgsquash.volume=cache"
