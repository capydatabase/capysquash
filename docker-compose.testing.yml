# pgsquash Multi-Version PostgreSQL Testing
# Extends docker-compose.yml with additional PostgreSQL versions
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.testing.yml up -d

services:
  # Extend core pgsquash service from docker-compose.yml
  pgsquash:
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-17:
        condition: service_healthy
      postgres-15:
        condition: service_healthy
      postgres-13:
        condition: service_healthy

  # PostgreSQL 17 (Latest) - Full test suite
  postgres-17:
    image: postgres:17
    container_name: pgsquash-postgres-17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pgsquash_test_17
      - POSTGRES_USER=pgsquash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pgsquash_secure_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-17-data:/var/lib/postgresql/data
      - ./docker/init-scripts/supabase-compat.sql:/docker-entrypoint-initdb.d/01-supabase-compat.sql:ro
      - ./docker/init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    networks:
      - pgsquash-net
    ports:
      - "${POSTGRES_17_PORT:-5417}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgsquash -d pgsquash_test_17"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.pgsquash.service=postgres-testing"
      - "com.pgsquash.version=17"

  # PostgreSQL 17 (LTS - Current Debian/Ubuntu default)
  postgres-15:
    image: postgres:15
    container_name: pgsquash-postgres-15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pgsquash_test_15
      - POSTGRES_USER=pgsquash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pgsquash_secure_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-15-data:/var/lib/postgresql/data
      - ./docker/init-scripts/supabase-compat.sql:/docker-entrypoint-initdb.d/01-supabase-compat.sql:ro
      - ./docker/init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    networks:
      - pgsquash-net
    ports:
      - "${POSTGRES_15_PORT:-5415}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgsquash -d pgsquash_test_15"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.pgsquash.service=postgres-testing"
      - "com.pgsquash.version=15"

  # PostgreSQL 13 (Legacy - EOL November 2025)
  postgres-13:
    image: postgres:13
    container_name: pgsquash-postgres-13
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pgsquash_test_13
      - POSTGRES_USER=pgsquash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pgsquash_secure_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-13-data:/var/lib/postgresql/data
      - ./docker/init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - pgsquash-net
    ports:
      - "${POSTGRES_13_PORT:-5413}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgsquash -d pgsquash_test_13"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.pgsquash.service=postgres-testing"
      - "com.pgsquash.version=13"
      - "com.pgsquash.legacy=true"

# Additional volumes for testing databases
volumes:
  postgres-17-data:
    driver: local
    labels:
      - "com.pgsquash.volume=postgres-17-testing"
  postgres-15-data:
    driver: local
    labels:
      - "com.pgsquash.volume=postgres-15-testing"
  postgres-13-data:
    driver: local
    labels:
      - "com.pgsquash.volume=postgres-13-testing"
