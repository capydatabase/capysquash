# Native release archives for the standalone pgsquash CLI.
# pg_query_go requires CGO, so release.yml runs this through goreleaser-cross.
version: 2

builds:
  - id: pgsquash-linux-amd64
    main: ./cmd/pgsquash
    binary: pgsquash
    env: [CGO_ENABLED=1, CC=x86_64-linux-gnu-gcc, CXX=x86_64-linux-gnu-g++]
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: pgsquash-linux-arm64
    main: ./cmd/pgsquash
    binary: pgsquash
    env: [CGO_ENABLED=1, CC=aarch64-linux-gnu-gcc, CXX=aarch64-linux-gnu-g++]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: pgsquash-darwin-amd64
    main: ./cmd/pgsquash
    binary: pgsquash
    env: [CGO_ENABLED=1, CC=o64-clang, CXX=o64-clang++]
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: pgsquash-darwin-arm64
    main: ./cmd/pgsquash
    binary: pgsquash
    env: [CGO_ENABLED=1, CC=oa64-clang, CXX=oa64-clang++]
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildDate={{.Date}}
      - -X main.gitCommit={{.FullCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: pgsquash-archive
    ids:
      - pgsquash-linux-amd64
      - pgsquash-linux-arm64
      - pgsquash-darwin-amd64
      - pgsquash-darwin-arm64
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^style:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: capysquash
    name: pgsquash-engine
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## pgsquash-engine {{ .Version }}

    Native archives are attached for Linux and macOS on amd64 and arm64.
    Verify downloads against `checksums.txt` before installation.
  footer: |
    Full changelog: https://github.com/capysquash/pgsquash-engine/compare/{{ .PreviousTag }}...{{ .Tag }}

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
