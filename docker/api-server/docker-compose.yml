# pgsquash API Server Deployment
# HTTP API with GitHub integration for Platforms
#
# Usage:
#   cd docker/api-server
#   docker compose up -d

services:
  api-server:
    build:
      context: ../..
      dockerfile: docker/api-server/Dockerfile
      args:
        - BUILD_VERSION=${BUILD_VERSION:-dev}
        - BUILD_DATE=${BUILD_DATE}
        - GIT_COMMIT=${GIT_COMMIT}
    image: pgsquash-api:${BUILD_VERSION:-latest}
    container_name: pgsquash-api-server
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # GitHub Integration (required for webhooks and OAuth)
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URL=${GITHUB_REDIRECT_URL:-http://localhost:8080/github/callback}

      # CORS Configuration
      - CORS_ORIGIN=${CORS_ORIGIN:-https://capysquash.dev}
      - PORT=${API_PORT:-8080}

      # AI Features (optional - for AI-powered analysis)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.pgsquash.service=api-server"
      - "traefik.enable=true"
      - "traefik.http.routers.pgsquash-api.rule=Host(`api.pgsquash.localhost`)"
      - "traefik.http.services.pgsquash-api.loadbalancer.server.port=8080"

networks:
  default:
    name: pgsquash-api-net
    driver: bridge
