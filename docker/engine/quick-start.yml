# pgsquash — quick start: the CLI in a container, no services.
#
#   docker compose -f docker/engine/quick-start.yml run --rm pgsquash squash /app/migrations
#   docker compose -f docker/engine/quick-start.yml run --rm pgsquash analyze /app/migrations
#   docker compose -f docker/engine/quick-start.yml run --rm --entrypoint bash pgsquash
#   CONFIG_DIR=./my-config docker compose -f docker/engine/quick-start.yml run --rm pgsquash squash
#
# `run`, not `up`: this is a one-shot CLI that exits when its command finishes.

name: pgsquash-quickstart

services:
  pgsquash:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      provenance: false
      sbom: false
    image: pgsquash:latest
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: false # writes into the mounted /app/output
    init: true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      PGSQUASH_SAFETY_LEVEL: ${PGSQUASH_SAFETY_LEVEL:-standard}
      PGSQUASH_LOG_LEVEL: ${PGSQUASH_LOG_LEVEL:-info}
    volumes:
      - ${MIGRATIONS_DIR:-./migrations}:/app/migrations:ro
      - ${OUTPUT_DIR:-./output}:/app/output
      - ${CONFIG_DIR:-./config}:/app/config:ro
    working_dir: /app
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
        reservations: { memory: 256M }
