version: '3.8'

# Quick Start - Simplest pgsquash usage
# Run the CLI tool in a container without any services

services:
  pgsquash:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pgsquash:latest
    container_name: pgsquash-cli
    environment:
      - PGSQUASH_SAFETY_LEVEL=${PGSQUASH_SAFETY_LEVEL:-standard}
      - PGSQUASH_LOG_LEVEL=${PGSQUASH_LOG_LEVEL:-info}
    volumes:
      - ${MIGRATIONS_DIR:-./migrations}:/app/migrations:ro
      - ${OUTPUT_DIR:-./output}:/app/output
      - ${CONFIG_DIR:-./config}:/app/config:ro
    working_dir: /app
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# Usage Examples:
#
# 1. Squash migrations:
#    docker-compose -f docker/engine/quick-start.yml run --rm pgsquash squash /app/migrations/*.sql
#
# 2. Analyze migrations:
#    docker-compose -f docker/engine/quick-start.yml run --rm pgsquash analyze /app/migrations/*.sql
#
# 3. Interactive shell:
#    docker-compose -f docker/engine/quick-start.yml run --rm pgsquash bash
#
# 4. With custom config:
#    CONFIG_DIR=./my-config docker-compose -f docker/engine/quick-start.yml run --rm pgsquash squash
