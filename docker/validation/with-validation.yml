# pgsquash — CLI with Docker-based validation.
# Needs access to /var/run/docker.sock (Docker Desktop running on macOS/Windows;
# membership of the `docker` group on Linux).
#
#   docker compose -f docker/validation/with-validation.yml run --rm pgsquash validate --docker /app/migrations
#   docker compose -f docker/validation/with-validation.yml run --rm pgsquash workflow --validate
#   docker compose -f docker/validation/with-validation.yml run --rm pgsquash squash /app/migrations --validate
#   docker compose -f docker/validation/with-validation.yml run --rm \
#     -e PGSQUASH_POSTGRES_VERSION=17 pgsquash validate --docker
#
# `run`, not `up`: this is a one-shot CLI that exits when its command finishes.

name: pgsquash-validation

services:
  pgsquash:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      provenance: false
      sbom: false
    image: pgsquash:latest
    restart: "no"
    # The socket is root:root 0660, so a non-root uid simply cannot open it -
    # the image's own uid 10001 gets "permission denied" and validation dies.
    # Mounting the socket already confers host-root, so running this one
    # service as root gives away nothing that the mount had not already given;
    # no-new-privileges and cap_drop stay on (root owns the socket, so no
    # CAP_DAC_OVERRIDE is needed). Files written into ./output will be
    # root-owned on Linux hosts.
    user: "0:0"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      PGSQUASH_SAFETY_LEVEL: ${PGSQUASH_SAFETY_LEVEL:-standard}
      PGSQUASH_LOG_LEVEL: ${PGSQUASH_LOG_LEVEL:-debug}
      PGSQUASH_DOCKER_ENABLED: "true"
      PGSQUASH_AUTO_VALIDATE: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ${MIGRATIONS_DIR:-./migrations}:/app/migrations:ro
      - ${OUTPUT_DIR:-./output}:/app/output
      - ${CONFIG_DIR:-./config}:/app/config:ro
      # Validation spawns throwaway Postgres containers on the host daemon.
      # That is full control of the daemon - development use only.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [validation-net]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }
        reservations: { cpus: "1", memory: 512M }

networks:
  validation-net:
    driver: bridge
